
name: SEA-CLOUD APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'sea-cloud-android-source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir source
          unzip -q sea-cloud-android-source.zip -d source
          find source -maxdepth 4 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          find source -name gradlew -type f -exec chmod +x {} \;
          cd source
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEA-CLOUD-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
